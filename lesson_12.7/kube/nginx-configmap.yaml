
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-configmap
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Custom Nginx Page</title>
    </head>
    <body>
        <h1>Hello, World! This is served via HTTPS.</h1>
    </body>
    </html>
